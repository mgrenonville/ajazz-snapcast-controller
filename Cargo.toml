[package]
name = "snapcast-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = {version = "0.1.17", features = ["sync"] } 
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# External crates
ajazz-sdk = {version = "0.2.1", features = ["async"] }
snapcast-control = "0.1.0"
rumqttc = "0.24"
dirs = "5"

# Image processing
image = "0.24"
icon-to-image = "0.1.6"
imageproc = "0.25.0"
ab_glyph = "0.2"

# External crates (USB HID and Snapcast integration)
# Note: These dependencies need to be configured with actual paths or git URLs
